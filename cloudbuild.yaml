steps:
  # 1. Create the Artifact Registry repository if it doesn't exist
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Check if the repository exists. If not, the 'describe' command will fail.
        # The '||' operator then executes the 'create' command.
        gcloud artifacts repositories describe emoji-semantic-change --location=us-central1 --project=$$PROJECT_ID || \
        gcloud artifacts repositories create emoji-semantic-change \
          --repository-format=docker \
          --location=us-central1 \
          --description="Docker repository for emoji-semantic-change app" \
          --project=$$PROJECT_ID
  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'
      - '.'

  # 3. Push the image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'

  # 3. Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'emoji-semantic-change' # <-- This is your Cloud Run service name
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # Add this if your service is public

# This tells Cloud Build where the final image is, for its records.
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY