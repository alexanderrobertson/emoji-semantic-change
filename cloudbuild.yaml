steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'
      - '.'

  # 2. Push the image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'

  # 3. Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'emoji-semantic-change' # <-- This is your Cloud Run service name
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # Add this if your service is public

# This tells Cloud Build where the final image is, for its records.
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/emoji-semantic-change:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY